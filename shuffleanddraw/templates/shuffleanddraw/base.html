<!DOCTYPE html>
{% load static %}
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shuffle and Draw{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    backgroundImage: {
                        'gradient-purple': 'linear-gradient(to right, #000000, #27004d)',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 pb-20">
    <!-- Header -->
    <header class="bg-gradient-purple text-white">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3 hover:opacity-80 transition-opacity cursor-pointer">
                    <div class="flex flex-col">
                        <div class="flex items-baseline">
                            <span class="text-2xl font-bold tracking-wider">SHUFFLE</span>
                            <span class="text-xl text-gray-400 mx-2">&</span>
                            <span class="text-2xl font-bold tracking-wider">DRAW</span>
                        </div>
                        <span class="text-xs text-gray-400 tracking-widest">TRADING CARDS</span>
                    </div>
                </div>
               
                <div class="flex-1 max-w-2xl mx-8">
                    <form method="GET" action="" class="relative">
                        <input type="text"
                               name="search"
                               placeholder="Search for cards..."
                               class="w-full px-4 py-2 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600">
                        <button type="submit" class="absolute right-2 top-1/2 transform -translate-y-1/2">
                            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                        </button>
                    </form>
                </div>
                <a href="#" class="flex items-center hover:text-purple-300 group relative">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <span class="absolute -top-2 -right-2 bg-purple-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </a>
            </div>
        </div>
    </header>
    {% block content %}{% endblock %}
    <!-- Footer -->
    <footer class="bg-gradient-purple text-white py-4 fixed bottom-0 w-full">
        <div class="container mx-auto px-4">
            <div class="text-center">
                <p>&copy; 2024 Shuffle & Draw. All rights reserved.</p>
            </div>
        </div>
    </footer>
</body>
</html>
