<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shuffle and Draw</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Top Navigation Bar -->
    <header class="bg-emerald-800 text-white">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <!-- Logo/Title -->
                <div class="text-xl font-bold">
                    Shuffle & Draw
                </div>
                
                <!-- Search Bar -->
                <div class="flex-1 max-w-2xl mx-8">
                    <div class="relative">
                        <input type="text" 
                               placeholder="Search for cards..." 
                               class="w-full px-4 py-2 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600"
                        >
                        <button class="absolute right-2 top-1/2 transform -translate-y-1/2">
                            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Navigation Links -->
                <div class="flex items-center space-x-4">
                    <a href="#" class="hover:text-emerald-200">Cart</a>
                    <a href="#" class="hover:text-emerald-200">Login</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Game Categories -->
    <div class="container mx-auto px-4 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
            <!-- Final Fantasy Section -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-2xl font-bold text-emerald-800 mb-4">Final Fantasy</h2>
                <ul class="space-y-2">
                    <li><a href="#" class="text-gray-600 hover:text-emerald-600 block">Singles</a></li>
                    <li><a href="#" class="text-gray-600 hover:text-emerald-600 block">Decks</a></li>
                    <li><a href="#" class="text-gray-600 hover:text-emerald-600 block">Boosters</a></li>
                </ul>
                <div class="mt-4">
                    <img src="/api/placeholder/300/200" alt="Final Fantasy Cards" class="w-full h-40 object-cover rounded-lg">
                </div>
            </div>

            <!-- Magic The Gathering Section -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-2xl font-bold text-emerald-800 mb-4">Magic: The Gathering</h2>
                <ul class="space-y-2">
                    <li><a href="#" class="text-gray-600 hover:text-emerald-600 block">Singles</a></li>
                    <li><a href="#" class="text-gray-600 hover:text-emerald-600 block">Decks</a></li>
                    <li><a href="#" class="text-gray-600 hover:text-emerald-600 block">Boosters</a></li>
                </ul>
                <div class="mt-4">
                    <img src="/api/placeholder/300/200" alt="Magic The Gathering Cards" class="w-full h-40 object-cover rounded-lg">
                </div>
            </div>

            <!-- Star Wars Section -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-2xl font-bold text-emerald-800 mb-4">Star Wars</h2>
                <ul class="space-y-2">
                    <li><a href="#" class="text-gray-600 hover:text-emerald-600 block">Singles</a></li>
                    <li><a href="#" class="text-gray-600 hover:text-emerald-600 block">Decks</a></li>
                    <li><a href="#" class="text-gray-600 hover:text-emerald-600 block">Boosters</a></li>
                </ul>
                <div class="mt-4">
                    <img src="/api/placeholder/300/200" alt="Star Wars Cards" class="w-full h-40 object-cover rounded-lg">
                </div>
            </div>

            <!-- Yu-Gi-Oh Section -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-2xl font-bold text-emerald-800 mb-4">Yu-Gi-Oh!</h2>
                <ul class="space-y-2">
                    <li><a href="#" class="text-gray-600 hover:text-emerald-600 block">Singles</a></li>
                    <li><a href="#" class="text-gray-600 hover:text-emerald-600 block">Decks</a></li>
                    <li><a href="#" class="text-gray-600 hover:text-emerald-600 block">Boosters</a></li>
                </ul>
                <div class="mt-4">
                    <img src="/api/placeholder/300/200" alt="Yu-Gi-Oh Cards" class="w-full h-40 object-cover rounded-lg">
                </div>
            </div>
        </div>
    </div>


    <!-- Footer -->
    <footer class="bg-emerald-800 text-white py-6 mt-8">
        <div class="container mx-auto px-4">
            <div class="text-center">
                <p>&copy; 2024 Shuffle & Draw. All rights reserved.</p>
            </div>
        </div>
    </footer>
</body>
</html>
